[package]
name = "contextlens"
version = "0.1.4"
description = "Hotkey capture, instant translation and a tutor mode"
edition = "2021"

[lib]
name = "contextlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
contextlens-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
arboard = "3"
enigo = "0.5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.22"
cpal = "0.18.2"
tokio = { version = "1.54.1", features = ["sync", "time", "macros", "rt"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots"] }
futures-util = "0.3.34"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
# GetAsyncKeyState: wait for the hotkey's modifiers to be released before pressing Copy.
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }
