# Builds signed installers for every platform and publishes a GitHub release with latest.json,
# the file the in-app updater reads. Start it either way:
#   - Actions tab -> release -> Run workflow (the tag v<version> is created from tauri.conf.json)
#   - push a tag like v0.2.0
name: release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, args: "--target aarch64-apple-darwin" }
          - { os: macos-latest, args: "--target x86_64-apple-darwin" }
          - { os: ubuntu-22.04, args: "" }
          - { os: windows-latest, args: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libdbus-1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxkbcommon-dev
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "ContextLens v__VERSION__"
          releaseBody: "Windows: download the .exe (or .msi). macOS: the .dmg. Linux: the .AppImage (auto-updates), .deb or .rpm."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
