# Builds signed installers and publishes a GitHub release with latest.json, the file the
# in-app updater reads. Installed apps with a lower version offer the update on their next check.
# Start it either way:
#   - Actions tab -> release -> Run workflow. Leave the version empty to release the latest
#     tag plus one patch (v0.1.4 -> 0.1.5), or type one such as 0.2.0
#   - push a tag like v0.2.0 (builds every platform)
name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.0. Empty = latest release + 1 (0.1.4 -> 0.1.5)"
        required: false
        type: string
      platforms:
        description: "Which installers to build"
        type: choice
        options: [all, windows]
        default: all
  push:
    tags: ["v*"]

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Every platform by default; "windows" alone is faster for a Windows-only fix.
        include: ${{ fromJSON(inputs.platforms == 'windows' && '[{"os":"windows-latest","args":"--bundles nsis"}]' || '[{"os":"macos-latest","args":"--target aarch64-apple-darwin"},{"os":"macos-latest","args":"--target x86_64-apple-darwin"},{"os":"ubuntu-24.04","args":""},{"os":"windows-latest","args":"--bundles nsis"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set the version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          V="${INPUT_VERSION#v}"
          if [ -z "$V" ] && [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Next patch after the highest vX.Y.Z tag.
            LAST=$(git ls-remote --tags origin 'refs/tags/v*' | sed 's#.*refs/tags/v##' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            IFS=. read -r MAJ MIN PAT <<< "${LAST:-0.0.0}"
            V="$MAJ.$MIN.$((PAT + 1))"
            echo "Latest release v${LAST:-none}; releasing v$V"
          fi
          [ -z "$V" ] && V="${REF_NAME#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version must look like 0.1.1, got '$V'"; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "::error::v$V is already released. Pick a higher version."; exit 1
          fi
          node -e '
            const fs = require("fs"), v = process.argv[1];
            for (const f of ["src-tauri/tauri.conf.json", "package.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8")); j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
            const c = "src-tauri/Cargo.toml";
            fs.writeFileSync(c, fs.readFileSync(c, "utf8").replace(/^version = ".*"$/m, `version = "${v}"`));
          ' "$V"
          echo "Releasing v$V"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libdbus-1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxkbcommon-dev \
            libpipewire-0.3-dev libclang-dev clang libxcb1-dev libxrandr-dev libgbm-dev libegl-dev libasound2-dev
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "ContextLens v__VERSION__"
          releaseBody: "下載：Windows 選 -setup.exe；macOS 選 .dmg（aarch64 是 Apple Silicon，x64 是 Intel）；Linux 選 .AppImage（可自動更新）、.deb 或 .rpm。已安裝的版本可以在 App 的「更新」頁直接更新。隱私政策與簽章政策：https://github.com/dalof41014/ContextLens#隱私"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
