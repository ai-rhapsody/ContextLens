# Builds signed installers and publishes a GitHub release with latest.json, the file the
# in-app updater reads. Installed apps with a lower version offer the update on their next check.
# Start it either way:
#   - Actions tab -> release -> Run workflow, type a version such as 0.1.1
#   - push a tag like v0.2.0 (builds every platform)
name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.1 (must be higher than the installed one)"
        required: true
        type: string
      platforms:
        description: "Which installers to build"
        type: choice
        options: [windows, all]
        default: windows
  push:
    tags: ["v*"]

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Run workflow defaults to Windows only (fast); a pushed tag or "all" builds every platform.
        include: ${{ fromJSON(inputs.platforms == 'windows' && '[{"os":"windows-latest","args":"--bundles nsis"}]' || '[{"os":"macos-latest","args":"--target aarch64-apple-darwin"},{"os":"macos-latest","args":"--target x86_64-apple-darwin"},{"os":"ubuntu-22.04","args":""},{"os":"windows-latest","args":"--bundles nsis"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set the version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          V="${INPUT_VERSION:-${REF_NAME#v}}"
          V="${V#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version must look like 0.1.1, got '$V'"; exit 1
          fi
          if [ -n "$INPUT_VERSION" ] && git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "::error::v$V is already released. Pick a higher version."; exit 1
          fi
          node -e '
            const fs = require("fs"), v = process.argv[1];
            for (const f of ["src-tauri/tauri.conf.json", "package.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8")); j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
            const c = "src-tauri/Cargo.toml";
            fs.writeFileSync(c, fs.readFileSync(c, "utf8").replace(/^version = ".*"$/m, `version = "${v}"`));
          ' "$V"
          echo "Releasing v$V"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libdbus-1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxkbcommon-dev \
            libpipewire-0.3-dev libclang-dev clang libxcb1-dev libxrandr-dev libgbm-dev libegl-dev
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "ContextLens v__VERSION__"
          releaseBody: "Windows: download the .exe (or .msi). macOS: the .dmg. Linux: the .AppImage (auto-updates), .deb or .rpm."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
