# Manual Windows test build. Needs no secrets.
# Run it from the Actions tab (workflow "build") and download the contextlens-windows artifact.
name: build
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build the installer
        shell: bash
        # Only the NSIS setup .exe: skipping the .msi (WiX) and updater artifacts saves time.
        run: npm run tauri build -- --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: contextlens-windows
          if-no-files-found: error
          path: target/release/bundle/nsis/*.exe
