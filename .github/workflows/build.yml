# Manual test builds. Needs no secrets.
# Run it from the Actions tab (workflow "build"), pick the platforms, and download the
# contextlens-<platform> artifact. These builds do not auto-update; releases do.
name: build
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which installers to build"
        type: choice
        options: [windows, macos, linux, all]
        default: windows

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          win='{"name":"windows","os":"windows-latest","args":"--bundles nsis","files":"target/release/bundle/nsis/*.exe"}'
          mac='{"name":"macos","os":"macos-latest","args":"--target universal-apple-darwin --bundles dmg","files":"target/universal-apple-darwin/release/bundle/dmg/*.dmg"}'
          lin='{"name":"linux","os":"ubuntu-24.04","args":"--bundles deb,appimage","files":"target/release/bundle/deb/*.deb\ntarget/release/bundle/appimage/*.AppImage"}'
          case "$PLATFORMS" in
            windows) m="[$win]" ;;
            macos) m="[$mac]" ;;
            linux) m="[$lin]" ;;
            *) m="[$win,$mac,$lin]" ;;
          esac
          echo "matrix=$m" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libdbus-1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxkbcommon-dev \
            libpipewire-0.3-dev libclang-dev clang libxcb1-dev libxrandr-dev libgbm-dev libegl-dev libasound2-dev
      - run: npm ci
      - name: Build the installer
        shell: bash
        env:
          # Test builds use no secrets: macOS is ad-hoc signed (signed releases come from release.yml).
          APPLE_SIGNING_IDENTITY: ${{ matrix.name == 'macos' && '-' || '' }}
        # Updater artifacts need the signing key; test builds skip them.
        run: npm run tauri build -- ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v6
        with:
          name: contextlens-${{ matrix.name }}
          if-no-files-found: error
          path: ${{ matrix.files }}
