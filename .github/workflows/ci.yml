name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libdbus-1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxkbcommon-dev \
            libpipewire-0.3-dev libclang-dev clang libxcb1-dev libxrandr-dev libgbm-dev libegl-dev libasound2-dev
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test -p contextlens-core
      - run: cargo test -p contextlens

  # Windows-only code (UI Automation, system audio) is compiled nowhere else before a release.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - run: cargo test -p contextlens

  # Known vulnerabilities in what ships: Rust crates, and npm packages outside the dev tools.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-audit }
      - run: cargo audit
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm audit --omit=dev --audit-level=high
