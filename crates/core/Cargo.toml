[package]
name = "contextlens-core"
version = "0.1.0"
edition = "2021"
description = "Provider streaming, prompts and settings for ContextLens (no GUI dependencies)"

[dependencies]
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util"] }
